  <script>
    // El mismo tema que la web: modo y color guardados
    (() => {
      const d = document.documentElement;
      d.classList.add('js');
      let mode = 'system', color = 'naranja';
      try { mode = localStorage.getItem('mode') || mode; color = localStorage.getItem('color') || color; } catch {}
      const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      d.dataset.mode = dark ? 'dark' : 'light';
      d.dataset.color = color;
    })();
  </script>
